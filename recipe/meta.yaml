{% set name = "fairchem-core" %}
{% set version = "2.23.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fairchem_core-{{ version }}.tar.gz
  sha256: 5b7a95b7f90b952f96a45ff32e709b5221ef2651b8c2d796fef59954752b8650
  patches:
    - readme.patch

build:
  entry_points:
    - fairchem = fairchem.core._cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme >=24
    - pip
  run:
    - backoff
    - nvalchemi-toolkit-ops >=0.4.1
    - ray-core >=2.53.0
    - ray-serve
    - scipy >=1.15.0
    - setuptools <81.0.0
    - huggingface_hub >=0.27.1
    - python >={{ python_min }},<3.14
    - pytorch >=2.13.0,<2.14.dev0
    - numpy >=2.0,<2.5
    - python-lmdb >=1.6.2,<=1.7.3
    - numba >=0.62.0
    - e3nn >=0.5
    - huggingface_hub >=0.27.1
    - ase >=3.26.0
    - ase-db-backends >=0.10.0
    - monty >=2026.2.18
    - clusterscope ==0.0.18
    - requests
    - orjson
    - tqdm
    - submitit >=1.5.4
    - hydra-core >=1.3
    - torchtnt
    - pyyaml
    - wandb
    - websockets

test:
  requires:
    - python {{ python_min }}
  imports:
    - fairchem.core
  commands:
    - fairchem --help

about:
  home: https://github.com/FAIR-Chem/fairchem
  summary: Machine learning models for use in catalysis as part of the Open Catalyst Project
  license: MIT
  license_file: src/fairchem/core/LICENSE.md

extra:
  recipe-maintainers:
    - jan-janssen
